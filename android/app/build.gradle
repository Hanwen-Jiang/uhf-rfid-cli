plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.hanwenjiang.uhfrfid'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId "com.hanwenjiang.uhfrfid"
        minSdk 21
        targetSdk 36
        versionCode 2
        versionName "1.1.0"

        // 云端默认配置，编译进 APK。设置里改过的值优先，这里只是"没配过时用什么"。
        // key 放在构建文件里而不是源码常量里，方便换 key 时只改一处。
        buildConfigField "String", "DEFAULT_CLOUD_BASE",
                '"https://rfid-tags.root-60a.workers.dev"'
        buildConfigField "String", "DEFAULT_API_KEY", '"b26f814150f2d7ee25cdee03fd0995434d9754eef7e5bbf99386f46383123187"'
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    buildTypes {
        release {
            // 不混淆，方便对着 re/PROTOCOL.md 调试
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // CH340/CH341、CP210x、FTDI、PL2303、CDC-ACM 的串口驱动
    implementation 'com.github.mik3y:usb-serial-for-android:3.11.0'

    // ---- Compose ----
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'

    // Lottie：矢量动画（连接成功/失败、盘存中）
    implementation 'com.airbnb.android:lottie-compose:6.6.2'

    debugImplementation 'androidx.compose.ui:ui-tooling'
}
