plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hanwenjiang.uhfrfid'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId "com.hanwenjiang.uhfrfid"
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName "1.0"

        // 云端默认配置，编译进 APK。设置里改过的值优先，这里只是"没配过时用什么"。
        // key 放在构建文件里而不是源码常量里，方便换 key 时只改一处。
        buildConfigField "String", "DEFAULT_CLOUD_BASE",
                '"https://rfid-tags.root-60a.workers.dev"'
        buildConfigField "String", "DEFAULT_API_KEY", '"b26f814150f2d7ee25cdee03fd0995434d9754eef7e5bbf99386f46383123187"'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            // 不混淆，方便对着 re/PROTOCOL.md 调试
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // CH340/CH341、CP210x、FTDI、PL2303、CDC-ACM 的串口驱动
    implementation 'com.github.mik3y:usb-serial-for-android:3.11.0'
}
